<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Lab · 每日提示词炼化</title><link rel="stylesheet" href="style.css?v=1791876222"></head>
<body>
<header class="hero"><div class="bar">
  <div class="brand">✦ Prompt Lab</div>
  <h1>每日提示词炼化实验室</h1>
  <p class="sub">每天从热门 AI 生图提示词中提炼出 10 个变量式模板，并附实测出图。点开卡片，替换 <code>{变量}</code>，一键复制即可使用。</p>
  <div class="toolbar"><label>日期 <select id="date"></select></label><span id="meta" class="meta"></span></div>
  <div id="chips" class="chips"></div>
</div></header>
<main class="gallery"><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>该日期暂无此模型生成的图片</div></main>
<dialog id="dlg"><article id="detail"></article></dialog>
<div id="toast" class="toast"></div>
<script src="app.js?v=1791876222"></script></body></html>
